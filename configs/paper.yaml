# Frozen confirmatory config. Do not retune after test lock.
# Paper experiments must load this file.

seed: 0

audio:
  target_sr: 8000
  frame_ms: 25.0
  hop_ms: 10.0
  channel_profile: narrowband
  tct_enabled: true          # evaluation only
  production_tct_enabled: false

fusion:
  acoustic_weight: 0.40
  linguistic_weight: 0.60
  suspicious_threshold: 0.35
  high_risk_threshold: 0.62
  use_conformal: true
  conformal_alpha: 0.10
  se_fraud_floor: 0.45
  se_synth_ceiling: 0.55
  probe_synth_floor: 0.55
  dual_floor: 0.50
  operating_fpr: [0.01, 0.05, 0.50]

acoustic:
  strf_weight: 0.45
  prototype_weight: 0.55
  history_frames: 30
  sapc_sigma_sec: 0.45
  sapc_mix_match: 0.12

linguistic:
  window_seconds: 45.0
  pattern_weight: 0.55
  discourse_weight: 0.45
  lexicon_lock: frozen

agent:
  max_challenges: 1
  lambda_cost: 0.45
  lambda_delay: 0.70
  inertia: 0.65
  benign_prior: 0.80
  challenge_fail:
    benign: 0.06
    social_engineering: 0.10
    synthetic_full: 0.82
    handoff: 0.55
    unknown_family: 0.40

eval:
  linguistic_confirmatory: independent
  acoustic_headline_vocoders: [lpc, neural_quant]
  acoustic_sanity_vocoders: [pulse_formant]
  sapc_min_pairs: 24
  bootstrap_n: 1000
  bootstrap_seed: 0
