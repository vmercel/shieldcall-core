name: ShieldCall CI

on:
  pull_request:
  push:
    branches:
      - main
      - "dev1/**"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install package and development dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"
      - name: Run tests with coverage
        run: pytest --cov=shieldcall --cov-report=term-missing
      - name: Lint
        run: ruff check shieldcall tests
      - name: Type check MVP foundation
        run: mypy --follow-imports=skip shieldcall/governance shieldcall/integrations shieldcall/mvp_service.py shieldcall/eval/governance.py
      - name: Audit Python dependencies
        run: pip-audit

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Dependency review
        uses: actions/dependency-review-action@v4
